name: Quality checks 👌🧪

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
  workflow_dispatch:

jobs:
  dependency-review:
    name: Vulnerable dependencies 🔎
    timeout-minutes: 10
    # Dependency review needs the dependency graph AND GitHub Advanced
    # Security. On this private repository under a free organisation plan the
    # action cannot run at all — proven by run 30230774481:
    #   ##[error]Dependency review is not supported on this repository. Please
    #   ensure that Dependency graph is enabled along with GitHub Advanced
    #   Security
    # Left armed it fails on every pull request regardless of the diff, which
    # is permanent red for a capability the plan does not include. The job is
    # kept intact and gated on a repository variable instead of being deleted:
    # set ENABLE_DEPENDENCY_REVIEW=true once Advanced Security is available.
    # This is visible, unmitigated security debt, not a fix.
    if: ${{ vars.ENABLE_DEPENDENCY_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    # Explicit. CodeQL's `actions/missing-workflow-permissions` flags an absent
    # block, because absent means "whatever the repository default happens to
    # be" rather than a decision. This job only reads the repository.
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          show-progress: false

      - name: Scan
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          ## Workaround from https://github.com/actions/dependency-review-action/issues/456
          ## TODO: Remove when necessary
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.ref }}

  quality:
    name: Run ${{ matrix.command }} 🕵️‍♂️
    runs-on: ubuntu-latest
    # Explicit. CodeQL's `actions/missing-workflow-permissions` flags an absent
    # block, because absent means "whatever the repository default happens to
    # be" rather than a decision. This job only reads the repository.
    permissions:
      contents: read
    # Minute economy: a hard ceiling. Without it a hung job bills up to the
    # 6-hour default; these commands finish in a couple of minutes.
    timeout-minutes: 20
    strategy:
      # Kept false on purpose: these commands fail for unrelated reasons and a
      # developer wants every verdict in one run rather than one sequential push
      # per failure. The legs are cheap and identical in cost.
      fail-fast: false
      matrix:
        command:
          - lint
          - stylelint
          - build:check
          - test
          # Guards the epubjs-scoped `@xmldom/xmldom` override: the pin sits
          # above the range EPUB.js declares, so the compatibility it depends on
          # has to be re-proven on every change rather than once, at the moment
          # the override was added.
          - test:epub-xmldom-fallback

    steps:
      - name: Checkout ⬇️
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          show-progress: false

      - name: Setup node environment ⚙️
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: true

      - name: Install dependencies 📦
        run: npm ci --no-audit

      - name: Run ${{ matrix.command }} ⚙️
        run: npm run ${{ matrix.command }}
