name: OneAmp AudioWorklet experiment
on:
  pull_request:
    paths:
      - 'tools/oneamp/**'
      - 'docs/audio/oneamp-audioworklet.md'
      - '.github/workflows/ci-oneamp-worklet.yml'
permissions:
  contents: read
jobs:
  worklet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
      - run: node tools/oneamp/build.mjs --output oneamp-dsp-out
      - run: node --test tools/oneamp/worklet/core.test.mjs
      - run: npx playwright install --with-deps chromium firefox
      - name: Actual browser PCM and graph lifecycle
        run: node tools/oneamp/worklet/browser.mjs
