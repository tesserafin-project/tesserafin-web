name: Pull Request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    # paths-ignore is deliberately NOT restored — see the header. With CodeQL
    # gated off this workflow no longer carries security analysis, but the
    # exclusion stays out so that re-enabling ENABLE_CODE_SCANNING does not
    # silently reintroduce a documentation blind spot.
    branches:
      - main
      - release*
  workflow_dispatch:

jobs:
  build:
    name: Build 🏗️
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/__package.yml
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  quality_checks:
    name: Quality checks 👌🧪
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/__quality_checks.yml
    # Upstream uses `permissions: {}` here, which works because
    # jellyfin/jellyfin-web is public: an empty-permission GITHUB_TOKEN can
    # still clone it. This repository is PRIVATE, so the same setting makes
    # actions/checkout fail with
    #   fatal: repository 'https://github.com/tesserafin-project/tesserafin-web/' not found
    # (proven by run 30230684855). contents: read is the minimum that lets the
    # checkout succeed, and it is still least-privilege.
    permissions:
      contents: read
    with:
      commit: ${{ github.event.pull_request.head.sha }}

  codeql:
    name: GitHub CodeQL 🔬
    # GATED OFF. Code scanning requires GitHub Advanced Security, which a
    # private repository on a free organisation plan does not have. The
    # analysis runs fine and then the upload is refused — proven by run
    # 30230774481, where "Initialize CodeQL" and "Autobuild" both succeeded
    # and the job then failed with:
    #   ##[error]Please verify that the necessary features are enabled:
    #   Advanced Security must be enabled for this repository to use code
    #   scanning.
    # Left armed it burns a full analysis on every event and then goes red at
    # the last step, every time. The job is kept intact and gated on a
    # repository variable rather than deleted: set ENABLE_CODE_SCANNING=true
    # once Advanced Security is available. LOSS OF COVERAGE IS REAL AND
    # UNMITIGATED — nothing else performs static security analysis here.
    if: ${{ vars.ENABLE_CODE_SCANNING == 'true' }}
    uses: ./.github/workflows/__codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      commit: ${{ github.event.pull_request.head.sha }}
