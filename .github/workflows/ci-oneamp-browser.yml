name: OneAmp browser proof

# Server-free proof of the OneAmp demonstrator (tesserafin/tesserafin#388,
# docs/tesserafin/oneamp-web-host-contract.md §9.3 step 5): the real audio
# player, graph, host, worklet and vendored wasm in Chromium and Firefox,
# measured with an analyser tap after the gain node.
on:
  pull_request:
    paths:
      - 'src/lib/oneamp/**'
      - 'src/lib/audio/**'
      - 'src/plugins/htmlAudioPlayer/**'
      - 'src/components/htmlMediaHelper.js'
      - 'tests/oneampBrowser/**'
      - 'webpack.oneamp.js'
      - 'webpack.captures.js'
      - 'playwright.oneamp.config.ts'
      - '.github/workflows/ci-oneamp-browser.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'

permissions: {}

concurrency:
  group: oneamp-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium and Firefox OneAmp proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Install pinned browsers and native dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Run the OneAmp browser suite
        run: npm run test:oneamp-browser
