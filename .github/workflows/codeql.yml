# RESTORED and made STANDALONE on 2026-08-01 (tesserafin-project/tesserafin#94,
# tesserafin-project/tesserafin#180).
#
# This file used to be `__codeql.yml`, a `workflow_call` reusable workflow invoked
# by `pull_request.yml` and `push.yml` behind `if: vars.ENABLE_CODE_SCANNING ==
# 'true'`. That gate existed because code scanning requires GitHub Advanced
# Security, which a PRIVATE repository on a free organisation plan does not have:
# run 30230774481 initialised and autobuilt successfully and then failed with
#   ##[error]Please verify that the necessary features are enabled: Advanced
#   Security must be enabled for this repository to use code scanning.
# This repository is now PUBLIC and code scanning is free on public repositories.
#
#   $ gh api repos/tesserafin-project/tesserafin-web -q '{visibility,private}'
#   {"visibility":"public","private":false}
#
# WHY STANDALONE. A `workflow_call` file cannot carry its own `schedule` or
# `workflow_dispatch`, and #94 requires all four triggers. Calling it from
# `pull_request.yml` also made the check-run name a nested
# `GitHub CodeQL 🔬 / Analyze …` string, which is a fragile thing to name in a
# required-status-check list. Standalone gives it four triggers and a stable
# check name of its own.
#
# ADVANCED SETUP, NOT DEFAULT SETUP. Default setup runs the `default` suite and
# cannot pin `security-extended`. #94 names `security-extended` explicitly, so the
# suite is declared here, in a file, at the exact commit that is analysed.
#
# QUERY SUITE CHANGE, stated so it is not read as an accidental downgrade. The
# previous value was `security-and-quality`, which is a strict superset of
# `security-extended`: it adds maintainability and reliability queries that are
# not security findings. `security-extended` is what #94's gate names and what the
# code-scanning API evidence must show, and dropping the non-security queries
# means fewer alerts that are not security work. Security coverage is unchanged.
#
# LANGUAGE COVERAGE.
#
#   javascript-typescript — the production language. 925 `.ts`, 332 `.tsx` and
#              245 `.js` tracked files; linguist reports 6.8 MB TypeScript and
#              2.8 MB JavaScript.
#   python   — `scripts/duplicates.py`, `scripts/remove.py`, `scripts/source.py`,
#              `scripts/unused.py`. Repository tooling, not shipped in the bundle.
#              Scanned anyway rather than argued about: four files cost almost
#              nothing and an unscanned interpreter in a public repository is a
#              worse default than an over-inclusive matrix.
#   actions  — the workflow definitions. This repository is now public, so any
#              stranger can open a pull request that touches `.github/`.
#
# NOT covered: SCSS, CSS and HTML are not CodeQL-supported languages.
#
# NO `continue-on-error`, anywhere. A CodeQL job that cannot initialise, build or
# upload must be red.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thursdays 03:11 UTC. Off the hour, and offset from the server repository's
    # CodeQL cron so the two do not contend for the same free-plan minutes.
    - cron: '11 3 * * 4'
  workflow_dispatch:

# Minimal and explicit. `actions: read` is the only permission beyond the two the
# analysis strictly needs: the CodeQL action reads its own run metadata through it.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          show-progress: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"
