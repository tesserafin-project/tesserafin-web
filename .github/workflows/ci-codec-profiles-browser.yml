name: Codec profile browser probes

on:
  pull_request:
    paths:
      - 'src/scripts/videoCodecProfiles*'
      - 'src/scripts/tesserafinPlaybackCapabilities*'
      - 'tests/e2e/video-codec-profiles-browser.spec.ts'
      - 'tests/e2e/support/origin-inventory.ts'
      - 'playwright.codecProfiles.config.ts'
      - '.github/workflows/ci-codec-profiles-browser.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'

permissions: {}

concurrency:
  group: codec-profile-probes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium and Firefox codec probes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - name: Install pinned browsers and native dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Validate profile mapping and wire contract
        run: npx vitest run src/scripts/videoCodecProfiles.test.ts src/scripts/tesserafinPlaybackCapabilities.test.ts
      - name: Record actual browser confidence and reject inconclusive claims
        run: npx playwright test --config playwright.codecProfiles.config.ts
