name: Cast on demand
on:
  pull_request:
    paths:
      - 'src/plugins/chromecastPlayer/**'
      - 'src/components/playback/playbackmanager.js'
      - 'src/components/playback/playerSelectionMenu.js'
      - 'src/apps/modern/components/AppToolbar/menus/RemotePlayMenu.tsx'
      - 'src/scripts/autocast*'
      - 'tests/chromecast/**'
      - 'tests/itemDetailsBrowser/cast.onDemand.browser.spec.ts'
      - '.github/workflows/ci-cast-on-demand.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:production
        env:
          JELLYFIN_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run verify:bundle-budget && npm run verify:delivery-budget
      - run: npx playwright test --config playwright.itemDetails.config.ts cast.onDemand.browser.spec.ts
