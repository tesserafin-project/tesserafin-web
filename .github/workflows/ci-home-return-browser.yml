name: Home return browser

on:
  pull_request:
    paths:
      - 'src/apps/modern/features/home/**'
      - 'src/apps/modern/routes/home.tsx'
      - 'src/ui/**'
      - 'src/components/Page.tsx'
      - 'src/scripts/libraryMenu.js'
      - 'tests/itemDetailsBrowser/home.return.browser.spec.ts'
      - 'tests/itemDetailsBrowser/support/fixtureApi.ts'
      - 'tests/reader/serve.mjs'
      - 'playwright.itemDetails.config.ts'
      - '.github/workflows/ci-home-return-browser.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'

permissions: {}

concurrency:
  group: home-return-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Home return on Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Build production candidate
        run: npm run build:production
        env:
          JELLYFIN_VERSION: ${{ github.event.pull_request.head.sha }}
      - name: Preserve delivery budgets
        run: npm run verify:bundle-budget && npm run verify:delivery-budget
      - name: Exercise Home to details to Back
        run: npx playwright test --config playwright.itemDetails.config.ts home.return.browser.spec.ts
