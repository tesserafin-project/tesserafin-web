name: Packaging 📦

on:
  workflow_call:
    inputs:
      commit:
        required: false
        type: string

jobs:
  run-build-prod:
    name: Run production build 🏗️
    runs-on: ubuntu-latest
    # Explicit. CodeQL's `actions/missing-workflow-permissions` flags an absent
    # block, because absent means "whatever the repository default happens to
    # be" rather than a decision. This job only reads the repository.
    permissions:
      contents: read
    # Minute economy: a hard ceiling instead of the 6-hour default.
    timeout-minutes: 25

    steps:
      - name: Check out Git repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}

      - name: Setup node environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: true

      - name: Install Node.js dependencies
        run: npm ci --no-audit

      - name: Run a production build
        env:
          JELLYFIN_VERSION: ${{ inputs.commit || github.sha }}
        run: npm run build:production

      # UPSTREAM STEP REMOVED (tesserafin-web #54 / B1).
      #
      # Upstream had an "Update config.json for testing" step here that used jq
      # to set `multiserver: true` and to write the Jellyfin project's public
      # demo server into the freshly built bundle's client configuration, so the
      # artifact pointed at an upstream-operated service instead of at whichever
      # server served it. That step was NOT gated on the repository, so it ran on every
      # pull request and every push to main in this repository and produced an
      # artifact whose FIRST runtime action was a call to an upstream-operated
      # service. B1 forbids exactly that. The bundle is now uploaded as built:
      # src/config.json ships `"multiserver": false` and `"servers": []`, so the
      # client talks only to the server that served it.
      #
      # scripts/verify-no-runtime-jellyfin.mjs fails the build if this — or any
      # equivalent injection of an upstream endpoint into a built artifact —
      # comes back.

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend
          path: dist
          if-no-files-found: error
          # Storage economy: the default retention is 90 days. This artifact
          # is a per-run production build used for inspection, not a release.
          retention-days: 7
