# Automatic npm dependency vulnerability audit — repository-local slice of
# tesserafin-project/tesserafin#95 (C2). New workflow, not a restoration:
# nothing has ever audited this repository's dependency graph on a hosted
# runner.
#
# WHY A SCHEDULE MATTERS HERE. Unlike a test suite, this gate's verdict changes
# without a commit: an advisory published tomorrow makes today's green run wrong.
# The weekly run is what turns "main was clean when we last touched it" into
# "main is clean", and it is the only trigger that can catch a newly disclosed
# vulnerability in a repository that is not being actively pushed to.
#
# THE COMPLETE LOCKFILE IS AUDITED — production, development and optional
# dependencies alike. `--omit=dev` would hide the build toolchain, which is
# exactly the surface that turns a compromised dependency into a compromised
# published bundle.
#
# WHAT THIS DOES NOT DO, and why.
#
#   * No SARIF upload and no code-scanning API call. Both need GitHub Advanced
#     Security, which a private repository on a free organisation plan does not
#     have — proven by run 30230774481, where the CodeQL analysis succeeded and
#     only the upload was refused. That is tracked by
#     tesserafin-project/tesserafin#94 (C1), not here.
#   * No `actions/dependency-review-action`. The dependency graph itself IS
#     available and is now enabled — 1464 packages, 51 open Dependabot alerts —
#     but the dependency-review API it calls needs Advanced Security on a
#     private repository. Alerts also only notify; they do not block, and
#     nothing in a notification stops a release. The existing pinned reference
#     to that action elsewhere in this repository is untouched.
#   * This status is NOT a required check. GET .../branches/main/protection and
#     GET .../rulesets both return 403 "Upgrade to GitHub Pro or make this
#     repository public to enable this feature". This workflow reports
#     automatically; nothing available on this plan can make it mandatory.
#     tesserafin-project/tesserafin#94 stays open for that.
#
# Deliberately NO paths-ignore. A dependency advisory has nothing to do with
# which files a pull request touched, and a filter here would let a
# documentation-only pull request merge without the lockfile ever being audited.

name: Dependency Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Mondays 06:41 UTC. Off the hour on purpose, and offset from the server
    # repository's audit so the two do not contend for the same free-plan
    # minutes at the same instant.
    - cron: "41 6 * * 1"
  # Diagnostics only. It cannot produce evidence that the automatic triggers
  # work, and a manual run is never accepted as proof of an automatic one.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull-request runs are cancelled; push and scheduled runs are not.
  # A cancelled push run would destroy exactly the post-merge evidence this
  # workflow exists to produce.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-audit:
    name: npm - Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Audit the pull request's own head, not the merge commit GitHub
          # synthesises: the merge commit is not what gets merged, and a report
          # produced from it cannot be attributed to a reviewable SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # `cache: npm` keys the npm cache on package-lock.json — the actual
      # dependency input. A key that ignored it would serve a stale graph to the
      # very check that is supposed to notice the graph changed.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record the scanner versions
        run: |
          set -euo pipefail
          {
            echo "### Scanner"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| node | \`$(node --version)\` |"
            echo "| npm | \`$(npm --version)\` |"
            echo "| report schema | \`npm audit --json\`, auditReportVersion 2 |"
            echo "| commit audited | \`${{ github.event.pull_request.head.sha || github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # `npm ci` and not `npm install`: the lockfile is the thing being audited,
      # and an install that is allowed to rewrite it would audit a graph that no
      # commit describes.
      - name: Install from the lockfile
        run: npm ci

      # The controls run BEFORE the live audit, on the same runner image that
      # judges the change. A red verdict inside them is the EXPECTED result and
      # is what makes this step pass; they assert the evaluator's own exit
      # status, so this step going green means the evaluator refuses every way
      # it is supposed to refuse. `--no-live` because the live half of the suite
      # is the next step, run once rather than twice.
      - name: Run the deterministic dependency-audit controls
        run: npm run test:dependency-audit -- --no-live

      # The verdict. scripts/dependency-audit.mjs exits 1 for an unresolved
      # high/critical finding and 2 for anything that means the question was not
      # answered — a registry failure, a malformed report, a zero-dependency
      # graph, an absent lockfile. Nothing downstream can turn either of those
      # green.
      - name: Audit the npm dependency graph
        run: npm run audit:dependencies

      # Always, including on a failing verdict — a report that only exists when
      # the gate is green is useless. There is no pull-request comment and
      # therefore no token, no write permission and no publication step whose
      # failure could hide or alter the verdict above.
      - name: Publish the summary
        if: ${{ always() }}
        run: |
          if [ -f dependency-audit-out/summary.md ]; then
            cat dependency-audit-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## npm dependency audit — INDETERMINATE"
              echo ""
              echo "The audit produced no summary; it failed before it could reach a verdict."
              echo "See the step log."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain the full report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit-out/
          if-no-files-found: warn
          retention-days: 7
