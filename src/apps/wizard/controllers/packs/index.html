<div id="wizardPacksPage" data-role="page" class="page standalonePage wizardPage">
    <div class="padded-left padded-right padded-top">
        <div class="ui-corner-all ui-shadow wizardContent">
            <form class="wizardPacksForm">
                <div class="verticalSection">
                    <h1 class="sectionTitle">${ContentPacks}</h1>
                    <p style="margin-top:1.5em;">${WizardContentPacksIntro}</p>

                    <fieldset class="wizardPacksFieldset" style="border:none;margin:0;padding:0;">
                        <legend class="hide">${ContentPacks}</legend>
                        <div class="wizardPackRows"></div>
                    </fieldset>

                    <div class="inputContainer wizardCustomPackContainer">
                        <input is="emby-input" type="text" id="txtCustomPackName" label="${LabelAddContentPack}" autocomplete="off" />
                        <button is="emby-button" type="button" class="raised btnAddCustomPack">
                            <span class="material-icons add" aria-hidden="true"></span>
                            <span>${ButtonAddContentPack}</span>
                        </button>
                    </div>

                    <p class="wizardPacksNoneSelected" role="status">${WizardContentPacksNoneSelected}</p>
                </div>

                <div class="verticalSection">
                    <h2 class="sectionTitle">${HeaderBrowsingArrangement}</h2>
                    <fieldset class="wizardArrangementFieldset" style="border:none;margin:0;padding:0;">
                        <legend class="hide">${HeaderBrowsingArrangement}</legend>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input type="radio" is="emby-radio" name="browsingArrangement" class="radioBrowsingArrangement" id="radioMediaFamilyFirst" value="MediaFamilyFirst" checked />
                                <span>${OptionBrowseByMediaFamily}</span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription">${OptionBrowseByMediaFamilyHelp}</div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label>
                                <input type="radio" is="emby-radio" name="browsingArrangement" class="radioBrowsingArrangement" id="radioContentPackFirst" value="ContentPackFirst" />
                                <span>${OptionBrowseByContentPack}</span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription">${OptionBrowseByContentPackHelp}</div>
                        </div>
                    </fieldset>
                </div>

                <p class="wizardPacksError hide" role="alert" tabindex="-1"></p>

                <div class="wizardNavigation">
                    <button is="emby-button" type="button" class="raised button-cancel" onclick="history.back();">
                        <span class="material-icons arrow_back" aria-hidden="true"></span>
                        <span>${Previous}</span>
                    </button>
                    <button is="emby-button" type="submit" class="raised button-submit">
                        <span>${Next}</span>
                        <span class="material-icons arrow_forward" aria-hidden="true"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
